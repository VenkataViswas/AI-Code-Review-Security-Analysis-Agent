[project]
name = "crsa-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "venkataviswas", email = "tumbalivenkataviswas@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "black>=26.10.1",
    "ipykernel>=7.4.0",
    "isort>=9.0.2",
    "langchain>=1.4.5",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.15",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.66.0",
]

[project.scripts]
crsa-agent = "crsa_agent:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
